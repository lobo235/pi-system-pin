name: nightly-pi

# Tests pi-system-pin against the newest pi on npm, including the two control tests that assert pi still has
# the flaw it works around (pi#5581). scripts/nightly-action.ts turns the outcome into one action:
# - retire: a control check failed (either control test, or the control runs of the pi binary smoke), so pi has
#   most likely fixed the flaw; open the retire issue, never record;
# - record: a new release line passed AND both control tests still show the flaw; open a pull request
#   recording it in pi-compat.json;
# - fail: anything else failed; open a failure issue.
# Nothing merges or publishes anything. The job that installs and runs the new pi has a read-only token.
# The reporting jobs have write permissions, but no checkout keeps credentials and the token is handed only to
# the one step of each that talks to GitHub: `record` first updates the lockfile (`npm install
# --package-lock-only --ignore-scripts`, which runs no package scripts) and pi-compat.json
# (scripts/record-pi-version.ts, from this repository) and commits, with no token in reach; its last step,
# which runs only git and gh, pushes and opens the pull request. scripts/nightly-workflow.test.ts checks this.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-pi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.pi.outputs.version }}
      action: ${{ steps.decide.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Find the newest pi and how it relates to pi-compat.json
        id: pi
        run: |
          version="$(npm view @earendil-works/pi-coding-agent version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "unexpected version: $version" >&2; exit 1; fi
          status="$(node --input-type=module -e "import { piVersionStatus, readPiCompat } from './src/pi-compat.ts'; console.log(piVersionStatus(process.argv[1], readPiCompat()))" "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "newest pi $version: $status"

      - name: Install it
        if: steps.pi.outputs.status != 'exact'
        env:
          PI_VERSION: ${{ steps.pi.outputs.version }}
        # pi publishes these in lockstep; the tests import all three (src/pi-compat.test.ts checks they match).
        run: |
          npm install --save-dev --save-exact "@earendil-works/pi-coding-agent@${PI_VERSION}" \
            "@earendil-works/pi-ai@${PI_VERSION}" "@earendil-works/pi-agent-core@${PI_VERSION}"

      - name: Test against it (the version gate and the control tests skipped)
        id: suite
        if: steps.pi.outputs.status != 'exact'
        run: |
          npm run typecheck
          node --test --test-skip-pattern="the vendored pi is on a release line|^control:" "src/**/*.test.ts" "scripts/**/*.test.ts"
          npm run load-smoke
          npm run smoke

      - name: Control checks (does pi still have the flaw?)
        id: control
        if: always() && steps.pi.outputs.status != 'exact' && steps.pi.outputs.version != ''
        shell: bash
        run: |
          node --test --test-name-pattern="^control:" --test-reporter=tap "src/**/*.test.ts" | tee "$RUNNER_TEMP/control.tap"
          # A renamed control test would match nothing and pass silently: require both to have run.
          ran="$(grep -cE '^(not )?ok [0-9]+ - control:' "$RUNNER_TEMP/control.tap" || true)"
          if [ "$ran" != "2" ]; then echo "expected 2 control tests, ran $ran" >&2; exit 1; fi
          # The same check with the pi binary over RPC, with folded and with mid-conversation system messages.
          node scripts/pi-smoke.ts --control-only

      - name: Decide what to report
        id: decide
        if: always()
        env:
          PI_VERSION: ${{ steps.pi.outputs.version }}
          PI_STATUS: ${{ steps.pi.outputs.status }}
          SUITE: ${{ steps.suite.outcome }}
          CONTROL: ${{ steps.control.outcome }}
        run: |
          action="$(node scripts/nightly-action.ts "$PI_VERSION" "$PI_STATUS" "$SUITE" "$CONTROL")"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "pi ${PI_VERSION:-?}: suite ${SUITE:-?}, control ${CONTROL:-?} -> $action"

  record:
    needs: test
    # Only when the suite passed AND every control check still shows the flaw (nightly-action.ts); never after a
    # control failure, which reports the retire issue instead. Opening the pull request needs the repository
    # setting "Allow GitHub Actions to create and approve pull requests" (CONTRIBUTING.md, Repository settings).
    if: always() && needs.test.outputs.action == 'record'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the nightly/pi-<version> branch
      pull-requests: write # open the pull request recording it
    env:
      PI_VERSION: ${{ needs.test.outputs.version }}
      BRANCH: nightly/pi-${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Record it in a local commit (no token)
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact "@earendil-works/pi-coding-agent@${PI_VERSION}" \
            "@earendil-works/pi-ai@${PI_VERSION}" "@earendil-works/pi-agent-core@${PI_VERSION}"
          node scripts/record-pi-version.ts "$PI_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json pi-compat.json
          git commit -m "pi-compat: record pi ${PI_VERSION} (nightly)"
      - name: Open a pull request recording it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$open" != "0" ]; then echo "a pull request from $BRANCH is already open"; exit 0; fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "$BRANCH exists without an open pull request; opening one"
          else
            gh auth setup-git
            git push origin "$BRANCH"
          fi
          if ! gh pr create --head "$BRANCH" --title "Record pi ${PI_VERSION}" --body "The nightly job ran the unit suite, the real-pi session tests, both control tests, the load smoke and the pi binary smoke (pi-system-pin packed and installed with pi install) on pi ${PI_VERSION}, and all passed: pi still has pi#5581 and pi-system-pin still holds the head. Close and reopen this pull request to start CI on it: a pull request opened by the workflow token does not trigger workflows."; then
            echo "::error::could not open the pull request from $BRANCH. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it by hand; the next nightly run retries."
            exit 1
          fi

  report-failure:
    needs: test
    if: always() && (needs.test.outputs.action == 'retire' || needs.test.outputs.action == 'fail')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write # open or update the nightly issue
    env:
      GH_REPO: ${{ github.repository }}
      PI_VERSION: ${{ needs.test.outputs.version }}
      ACTION: ${{ needs.test.outputs.action }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open an issue unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ACTION" = "retire" ]; then
            title="Nightly: pi ${PI_VERSION} no longer has pi#5581, retire pi-system-pin"
            body="A control check failed on pi ${PI_VERSION}: ${RUN_URL}. The control checks run WITHOUT pi-system-pin and assert that a run started by a custom message still loses the extensions' prompt sections. When one fails, pi has most likely fixed pi#5581 and this package should be retired (README, When pi fixes pi#5581). Confirm in the log and on https://github.com/earendil-works/pi/issues/5581, then make the final release (pi-compat.json stopping at the last affected pi line) and npm deprecate the package with a message naming the fixed pi version."
          else
            title="Nightly: pi-system-pin fails on pi ${PI_VERSION}"
            body="The nightly run against pi ${PI_VERSION} failed: ${RUN_URL}. The control checks passed, so pi still has pi#5581. Until it is fixed, add it to the README's Known issues."
          fi
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')"
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "$body"
          fi
