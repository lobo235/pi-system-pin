name: Bug report
description: pi-system-pin did something wrong, or the system block still changed between runs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real transcript here.** It contains your conversations, and this issue is public. Describe
        its shape, or build a synthetic one. Security problems go to the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The output of `pi --version`, and the pi-system-pin version (`pi list`).
    validations:
      required: true
  - type: textarea
    id: extensions
    attributes:
      label: Other extensions
      description: |
        Which extensions add or rewrite system-prompt sections, and which start runs with custom messages
        (`sendMessage` with `triggerTurn`). Package names are enough.
  - type: input
    id: model
    attributes:
      label: Model class
      description: The kind of model, e.g. "self-hosted, OpenAI-compatible" or "hosted catalog model". No need to name a provider.
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, ideally with a synthetic session. Optional.
